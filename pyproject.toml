[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Agentic SDLC platform — Temporal + LangGraph + LiteLLM prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "temporalio>=1.7.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.0",
  "boto3>=1.35.0",
  "prometheus-client>=0.21.0",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "bandit>=1.8.0",
  "httpx>=0.27.0",
]
judge = [
  "ragas>=0.2.0",
  "guardrails-ai>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
